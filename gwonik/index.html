<script>
(function(){
  var track=document.getElementById('track'),slides=track.children,n=slides.length,
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      dots=document.getElementById('dots'),cur=0;
  for(var i=0;i<n;i++){var b=document.createElement('button');b.setAttribute('aria-label',(i+1)+'번째 카드');(function(k){b.onclick=function(){go(k)}})(i);dots.appendChild(b)}
  function go(i){i=Math.max(0,Math.min(n-1,i));track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
  function update(){
    cur=Math.round(track.scrollLeft/track.clientWidth);
    prev.disabled=cur===0;next.disabled=cur===n-1;
    for(var i=0;i<n;i++)dots.children[i].className=i===cur?'on':'';
  }
  prev.onclick=function(){go(cur-1)};next.onclick=function(){go(cur+1)};
  track.addEventListener('scroll',function(){window.requestAnimationFrame(update)});
  track.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  window.addEventListener('resize',function(){go(cur)});
  update();
})();
</script>
